<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudySync | Smart Study Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20243a;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        h1 {
            font-size: 30px;
        }

        header p {
            color: #73798d;
            margin-top: 8px;
        }

        .badge {
            background: #e0e7ff;
            color: #4338ca;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 5px 20px #20243a08;
        }

        .card p {
            color: #73798d;
            font-size: 14px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 12px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 21px;
        }

        form {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.5fr 1fr auto;
            gap: 12px;
        }

        input,
        select,
        button {
            padding: 12px;
            border: 1px solid #e0e3ed;
            border-radius: 9px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            min-width: 0;
            background: white;
            color: #20243a;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #3730a3;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid #818cf8;
            outline-offset: 2px;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .task:last-child {
            border-bottom: none;
        }

        .task h3 {
            font-size: 16px;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .task p {
            color: #73798d;
            font-size: 13px;
        }

        .priority {
            font-size: 12px;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 20px;
            background: #fff0e8;
            color: #c2410c;
            white-space: nowrap;
        }

        .task-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .task-actions button {
            padding: 9px 11px;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .delete:hover {
            background: #fecaca;
        }

        .completed h3 {
            text-decoration: line-through;
            color: #9298a8;
        }

        .empty {
            color: #73798d;
            padding: 20px 0;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            margin-bottom: 0;
        }

        .plan-button {
            padding: 12px 16px;
            background: #4338ca;
        }

        .plan-button:hover {
            background: #312e81;
        }

        #studyPlanResult {
            margin-bottom: 20px;
        }

        .plan-card {
            background: #f8faff;
            border: 1px solid #e0e7ff;
            border-radius: 14px;
            padding: 22px;
        }

        .plan-card h3 {
            margin-bottom: 10px;
            font-size: 19px;
        }

        .plan-description {
            color: #73798d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .plan-item {
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .plan-item:last-child {
            border-bottom: none;
        }

        .plan-item strong {
            display: block;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .plan-item p {
            color: #73798d;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .plan-error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 14px;
            border-radius: 9px;
            font-size: 14px;
        }

        @media (max-width: 1000px) {
            form {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            form button {
                grid-column: 1 / -1;
            }

            .task {
                align-items: flex-start;
                flex-direction: column;
            }

            .task-actions {
                justify-content: flex-start;
            }
        }

        @media (max-width: 800px) {
            body {
                padding: 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .section {
                padding: 18px;
            }

            form {
                grid-template-columns: 1fr;
            }

            form button {
                grid-column: auto;
            }

            .section-heading {
                align-items: stretch;
                flex-direction: column;
            }

            .plan-button {
                width: 100%;
            }

            .task-actions {
                gap: 6px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>StudySync 📚</h1>
            <p>Your personal smart study planner</p>
        </div>

        <span class="badge">● System Connected</span>
    </header>

    <!-- Dashboard statistics -->
    <section class="stats">

        <div class="card">
            <p>Total Study Tasks</p>
            <div class="number" id="totalTasks">0</div>
        </div>

        <div class="card">
            <p>Completed Tasks</p>
            <div class="number" id="completedTasks">0</div>
        </div>

        <div class="card">
            <p>Pending Tasks</p>
            <div class="number" id="pendingTasks">0</div>
        </div>

    </section>

    <!-- Add task form -->
    <section class="section">

        <h2>＋ Add a Study Task</h2>

        <form id="taskForm">

            <input
                id="title"
                type="text"
                placeholder="Task name"
                maxlength="150"
                required
            >

            <input
                id="subject"
                type="text"
                placeholder="Subject"
                maxlength="100"
                required
            >

            <input
                id="deadline"
                type="date"
                required
            >

            <select id="priority" aria-label="Task priority">
                <option value="HIGH">High Priority</option>
                <option value="MEDIUM">Medium Priority</option>
                <option value="LOW">Low Priority</option>
            </select>

            <button type="submit">Add Task</button>

        </form>

    </section>

    <!-- Study tasks and smart plan -->
    <section class="section">

        <div class="section-heading">

            <h2>My Study Tasks</h2>

            <button
                type="button"
                class="plan-button"
                id="generatePlanButton"
            >
                🧠 Generate Smart Study Plan
            </button>

        </div>

        <div id="studyPlanResult" aria-live="polite"></div>

        <div id="taskList">
            <p class="empty">Loading your tasks...</p>
        </div>

    </section>

    <script>
        "use strict";

        const API = "/api/tasks";
        const STUDY_PLAN_API = "/api/study-plan/rebalance";

        // Safely escape text before placing it inside HTML.
        function escapeHtml(value) {
            const element = document.createElement("span");
            element.textContent = value ?? "";
            return element.innerHTML;
        }

        // Load tasks and update dashboard statistics.
        async function loadTasks() {
            const list = document.getElementById("taskList");

            try {
                const response = await fetch(API);

                if (!response.ok) {
                    throw new Error("Could not load tasks");
                }

                const tasks = await response.json();

                document.getElementById("totalTasks").textContent =
                    tasks.length;

                document.getElementById("completedTasks").textContent =
                    tasks.filter(task => task.completed).length;

                document.getElementById("pendingTasks").textContent =
                    tasks.filter(task => !task.completed).length;

                if (tasks.length === 0) {
                    list.innerHTML =
                        '<p class="empty">No tasks yet. Add your first study task above!</p>';
                    return;
                }

                list.innerHTML = tasks.map(task => `
                    <div class="task ${task.completed ? "completed" : ""}">

                        <div>
                            <h3>${escapeHtml(task.title)}</h3>
                            <p>
                                ${escapeHtml(task.subject)}
                                · Due: ${escapeHtml(task.deadline)}
                            </p>
                        </div>

                        <div class="task-actions">

                            <span class="priority">
                                ${escapeHtml(task.priority)}
                            </span>

                            <button
                                type="button"
                                onclick="toggleTask(${Number(task.id)}, ${!task.completed})"
                            >
                                ${task.completed ? "Undo" : "Complete"}
                            </button>

                            <button
                                type="button"
                                class="delete"
                                onclick="deleteTask(${Number(task.id)})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>
                `).join("");

            } catch (error) {
                list.innerHTML =
                    '<p class="empty">Unable to load tasks. Make sure the Spring Boot server is running.</p>';

                console.error("Load tasks error:", error);
            }
        }

        // Add a new task.
        document.getElementById("taskForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const task = {
                    title: document.getElementById("title").value.trim(),
                    subject: document.getElementById("subject").value.trim(),
                    deadline: document.getElementById("deadline").value,
                    priority: document.getElementById("priority").value,
                    completed: false
                };

                if (!task.title || !task.subject || !task.deadline) {
                    alert("Please fill in all task fields.");
                    return;
                }

                try {
                    const response = await fetch(API, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(task)
                    });

                    if (!response.ok) {
                        throw new Error("Could not save task");
                    }

                    event.target.reset();

                    document.getElementById("studyPlanResult").innerHTML = "";

                    await loadTasks();

                } catch (error) {
                    alert(
                        "Unable to save the task. Check that the backend is running."
                    );

                    console.error("Add task error:", error);
                }
            }
        );

        // Mark a task complete or return it to pending.
        async function toggleTask(id, completed) {
            try {
                const response = await fetch(`${API}/${id}`);

                if (!response.ok) {
                    throw new Error("Task not found");
                }

                const task = await response.json();
                task.completed = completed;

                const updateResponse = await fetch(`${API}/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(task)
                });

                if (!updateResponse.ok) {
                    throw new Error("Task update failed");
                }

                document.getElementById("studyPlanResult").innerHTML = "";

                await loadTasks();

            } catch (error) {
                alert("Unable to update task.");
                console.error("Update task error:", error);
            }
        }

        // Delete a task.
        async function deleteTask(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this task?"
            );

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`${API}/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Task deletion failed");
                }

                document.getElementById("studyPlanResult").innerHTML = "";

                await loadTasks();

            } catch (error) {
                alert("Unable to delete task.");
                console.error("Delete task error:", error);
            }
        }

        // Generate a suggested order for pending tasks.
        async function generateStudyPlan() {
            const result = document.getElementById("studyPlanResult");
            const button = document.getElementById("generatePlanButton");

            result.innerHTML =
                '<p class="empty">🧠 Generating your suggested study plan...</p>';

            button.disabled = true;
            button.textContent = "Generating...";

            try {
                const response = await fetch(STUDY_PLAN_API);

                if (!response.ok) {
                    throw new Error(
                        "The study plan endpoint returned an error."
                    );
                }

                const tasks = await response.json();

                if (!Array.isArray(tasks)) {
                    throw new Error("Unexpected study plan response.");
                }

                if (tasks.length === 0) {
                    result.innerHTML = `
                        <div class="plan-card">
                            <h3>🎉 You're all caught up!</h3>
                            <p class="plan-description">
                                There are no pending tasks to organize.
                                Add a new task or mark a completed task as pending.
                            </p>
                        </div>
                    `;

                    return;
                }

                result.innerHTML = `
                    <div class="plan-card">

                        <h3>🧠 Your Suggested Study Order</h3>

                        <p class="plan-description">
                            Your pending tasks are ordered using the
                            backend's priority and deadline rules.
                            Review this suggestion before deciding what to study.
                            No tasks or deadlines have been changed.
                        </p>

                        ${tasks.map((task, index) => `
                            <div class="plan-item">

                                <strong>
                                    ${index + 1}. ${escapeHtml(task.title)}
                                </strong>

                                <p>
                                    Subject: ${escapeHtml(task.subject)}
                                </p>

                                <p>
                                    Deadline: ${escapeHtml(task.deadline)}
                                </p>

                                <p>
                                    Priority: ${escapeHtml(task.priority)}
                                </p>

                            </div>
                        `).join("")}

                    </div>
                `;

            } catch (error) {
                console.error("Study plan error:", error);

                result.innerHTML = `
                    <div class="plan-error">
                        Could not generate the study plan.
                        Make sure the Spring Boot server is running
                        and the /api/study-plan/rebalance endpoint is available.
                    </div>
                `;

            } finally {
                button.disabled = false;
                button.textContent = "🧠 Generate Smart Study Plan";
            }
        }

        // Connect the Smart Study Plan button.
        document.getElementById("generatePlanButton").addEventListener(
            "click",
            generateStudyPlan
        );

        // Load existing tasks when the page opens.
        loadTasks();
    </script>

</body>
</html>
